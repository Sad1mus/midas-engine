name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: |
          source .venv/bin/activate
          mypy scripts/ infra/ core/ || true   # lenient for Day 0; tighten in DEC posterior

      - name: Verify vault frontmatter (no DB needed)
        run: |
          source .venv/bin/activate
          python scripts/verify_chain.py --check-frontmatter-only

      - name: Initialize fresh DB
        run: |
          source .venv/bin/activate
          python scripts/init_db.py

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest -q --cov-report=xml

      - name: Verify hash chain after tests
        run: |
          source .venv/bin/activate
          python scripts/verify_chain.py
