[workspace]
resolver = "2"

# Members will be added when Veto actor begins (see DEC-005 / Trim1 roadmap).
# Anticipated structure:
#   members = ["crates/veto_actor", "crates/hash_chain", "crates/tda_ext"]
members = []

[workspace.package]
edition = "2021"
rust-version = "1.78"
authors = ["Zenithstone Holding"]
license = "Proprietary"

[workspace.dependencies]
# Pinned across the workspace once crates are added
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
